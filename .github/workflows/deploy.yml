name: Deploy PIXEL BASTION
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pixel-bastion-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble game site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -s "PIXEL_BASTION_v0.3.2_FEMALE_NPC_GITHUB.zip" ]; then
            echo "Complete ZIP found"
            unzip -q "PIXEL_BASTION_v0.3.2_FEMALE_NPC_GITHUB.zip" -d _site
          elif [ -s "PIXEL_BASTION_v0.3.2_PART1_GAME_MALE.zip" ] && [ -s "PIXEL_BASTION_v0.3.2_PART2_FEMALE.zip" ]; then
            echo "Two split ZIPs found"
            unzip -q "PIXEL_BASTION_v0.3.2_PART1_GAME_MALE.zip" -d _site
            unzip -oq "PIXEL_BASTION_v0.3.2_PART2_FEMALE.zip" -d _site
          elif [ -s "index.html" ] && [ -s "game.js" ] && [ -s "style.css" ] && [ -d "assets" ]; then
            echo "Extracted site root found"
            cp -a index.html game.js style.css assets _site/
          else
            echo "::error::Game files missing. Please upload both PART1 and PART2 ZIPs."
            exit 1
          fi
          if [ -d overlays ]; then
            cp -a overlays/. _site/
          fi
          echo "Extracted top-level files:"
          ls -la _site | head -40
          echo "NPC file sample:"
          find _site -type f -iname "*walk*" | head -20 || true
          if [ ! -s "_site/index.html" ]; then
            located="$(find _site -type f -name index.html -print -quit)"
            if [ -n "$located" ]; then
              dir="$(dirname "$located")"
              echo "Flattening game root from $dir"
              cp -a "$dir"/. _site/
            fi
          fi
          # Preserve the original v0.3.2 ZIPs; apply future source updates during packaging.
          if [ -f overlays/patch_v033.py ]; then
            python3 overlays/patch_v033.py _site
          fi
          if [ -f overlays/patch_v034.py ]; then
            python3 overlays/patch_v034.py _site
          fi
          if [ -f overlays/patch_v035.py ]; then
            python3 overlays/patch_v035.py _site
          fi
          if [ -f overlays/patch_v036.py ]; then
            python3 overlays/patch_v036.py _site
          fi
          if [ -f overlays/patch_v037.py ]; then
            python3 overlays/patch_v037.py _site
          fi
          # Decode optional directly committed source sprites (newer variants).
          if [ -d overlays/npc-assets ]; then
            mkdir -p _site/assets/npc/NPC_MALE2
            for input in overlays/npc-assets/*.webp.b64; do
              [ -f "$input" ] || continue
              base64 -d "$input" > "_site/assets/npc/NPC_MALE2/$(basename "$input" .b64)"
            done
          fi
          for f in             index.html             game.js             style.css             assets/npc/NPC_MALE/male_walk_4dir_3frames.png             assets/npc/NPC_FEMALE/female_walk_4dir_4frames.png
          do
            if [ ! -s "_site/$f" ]; then
              echo "::error::Missing required site file: $f"
              exit 1
            fi
          done
          # Fail deployment if resident sprite files or generated game code are broken.
          test -s _site/assets/npc/NPC_MALE2/male2_walk_4dir_4frames.png
          test -s _site/assets/npc/NPC_MALE2/male2_emotes_6poses.png
          test -s _site/assets/npc/NPC_FEMALE2/female_02_walk_4dir_4frames.png
          test -s _site/assets/npc/NPC_FEMALE2/female_02_emotes_6poses.png
          test -s _site/assets/npc/NPC_MALE3/male3_walk_4dir_4frames.png
          test -s _site/assets/npc/NPC_MALE3/male3_emotes_6poses.png
          test -s _site/assets/npc/NPC_FEMALE3/female3_walk_4dir_4frames.png
          test -s _site/assets/npc/NPC_FEMALE3/female3_emotes_6poses.png
          test -s _site/assets/reserve/mine_entrance_source.png
          test -s _site/assets/reserve/farm_plot_source.png
          test -s _site/assets/reserve/miner_worker_source.png
          grep -q "PIXEL BASTION v0.3.7" _site/game.js
          grep -q "ECON_PRODUCTION_INTERVAL = 10" _site/game.js
          grep -q "ECON_FOOD_INTERVAL = 60" _site/game.js
          grep -q 'id="mineBuildBtn"' _site/index.html
          grep -q 'id="foodValue"' _site/index.html
          grep -q "NPC_INTERACTIONS_ENABLED = false" _site/game.js
          grep -q "NPC_AUTO_CHAT_ENABLED = false" _site/game.js
          node --check _site/game.js
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
