name: Deploy PIXEL BASTION
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pixel-bastion-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble game site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -s "PIXEL_BASTION_v0.3.2_FEMALE_NPC_GITHUB.zip" ]; then
            echo "Assembling from single complete package"
            unzip -q "PIXEL_BASTION_v0.3.2_FEMALE_NPC_GITHUB.zip" -d _site
          elif [ -s "PIXEL_BASTION_v0.3.2_PART1_GAME_MALE.zip" ] && [ -s "PIXEL_BASTION_v0.3.2_PART2_FEMALE.zip" ]; then
            echo "Assembling from two split packages"
            unzip -q "PIXEL_BASTION_v0.3.2_PART1_GAME_MALE.zip" -d _site
            unzip -oq "PIXEL_BASTION_v0.3.2_PART2_FEMALE.zip" -d _site
          elif [ -s "index.html" ] && [ -s "game.js" ] && [ -s "style.css" ] && [ -d "assets" ]; then
            echo "Assembling from extracted files"
            cp -a index.html game.js style.css assets _site/
          else
            echo "::error::Missing complete game. Upload BOTH PIXEL_BASTION_v0.3.2_PART1_GAME_MALE.zip and PIXEL_BASTION_v0.3.2_PART2_FEMALE.zip to repository root, or upload a complete game package."
            exit 1
          fi
          if [ -d overlays ]; then
            cp -a overlays/. _site/
          fi
          test -s _site/index.html
          test -s _site/game.js
          test -s _site/style.css
          test -s _site/assets/npc/NPC_MALE/male_walk_4dir_3frames.png
          test -s _site/assets/npc/NPC_FEMALE/female_walk_4dir_4frames.png
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deploy
